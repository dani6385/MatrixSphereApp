// File: d:\MatrixSphereApp\apps\client_connectivity\android\build.gradle

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1' // Pastikan versi 8.x
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// This block forces all sub-projects (like Flutter plugins) to use the
// specified compile SDK version, overriding their own settings. This is
// crucial for resolving compatibility issues with newer Android targets.
subprojects {
    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.android.library')) {
            android {
                compileSdkVersion 35 // Force SDK 35 for all library modules
                buildToolsVersion "34.0.0" // Ensure a consistent build tools version
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}