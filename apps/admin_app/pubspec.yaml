name: admin_app
publish_to: 'none'
description: A shared provider for real-time Firebase data.
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  provider: ^6.0.0
  fl_chart: ^0.68.0        # Tambahkan ini untuk error fl_chart
  syncfusion_flutter_charts: ^26.1.35 # Tambahkan ini untuk error syncfusion
  shared_services:
    path: ../../packages/shared_services

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0