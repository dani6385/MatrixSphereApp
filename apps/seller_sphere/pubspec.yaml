publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

# Menyatakan bahwa paket ini adalah bagian dari workspace
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Dependensi ke paket lokal lain dalam workspace
  shared_ui:
    path: ../../packages/shared_ui
  firebase_core: ^2.32.0
  firebase_crashlytics: ^3.5.7
  shared_services: ^1.0.0+1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
