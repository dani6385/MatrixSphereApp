name: shop_sphere
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace

dependencies:
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  google_nav_bar: ^5.0.7
  logger: ^2.7.0
  provider: ^6.1.5+1
  shared_navigations: ^0.0.1
  shared_services: ^0.0.1
  shared_ui: ^0.0.1
  flutter_launcher_icons: "^0.14.1"
  

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg" # Sesuaikan dengan lokasi file gambar Anda
  min_sdk_android: 21
