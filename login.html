<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mengarahkan...</h1>
        <p>Silakan tunggu, kami sedang menyiapkan sesi Anda.</p>
        <div class="loader"></div>
    </div>

    <script>
        (function() {
            // --- Konfigurasi ---
            // ❗ PENTING: Ganti nilai di bawah ini dengan Application ID aplikasi Android Anda
            // yang ada di file android/app/build.gradle.
            const ANDROID_PACKAGE_NAME = "com.matrixsphere.clienthotspot"; 

            // Ganti dengan scheme yang Anda daftarkan di aplikasi Android
            const ANDROID_APP_SCHEME = "clienthotspot://login"; 
            // Halaman tujuan untuk Windows dan OS lainnya
            const AUTH_PAGE_URL = "auth.html";
            // --- Akhir Konfigurasi ---

            const ua = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(ua)) {
                // Pengguna Android
                const playStoreUrl = `https://play.google.com/store/apps/details?id=${ANDROID_PACKAGE_NAME}`;
                
                // Coba buka aplikasi
                window.location.href = ANDROID_APP_SCHEME;

                // Jika aplikasi tidak terpasang, setelah 2 detik arahkan ke Play Store
                setTimeout(() => {
                    window.location.href = playStoreUrl;
                }, 2000);

            } else if (/windows phone/i.test(ua) || /win/i.test(ua)) {
                // Pengguna Windows
                window.location.href = AUTH_PAGE_URL;
            } else {
                // Pengguna OS lain (iOS, macOS, Linux, dll)
                window.location.href = AUTH_PAGE_URL;
            }
        })();
    </script>

</body>
</html>
