name: matrix_sphere
description: A new Flutter project for the Matrix Sphere monorepo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  firebase_database: ^12.4.6
  firebase_core: ^4.12.1
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.2.6
  google_nav_bar: ^5.0.7
  intl: ^0.20.3
  logger: ^2.7.0
  table_calendar: ^3.2.0
  shared_services:
    path: packages/shared_services
  shared_ui:
    path: packages/shared_ui
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^8.2.2

flutter:
  uses-material-design: true
  assets:
    - images/

workspace:
  - apps/seller_sphere
  - apps/shop_sphere
  - packages/shared_services
  - packages/shared_ui
  - apps/seller_sphere/third_party/media_info
