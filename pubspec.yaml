  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router: ^17.3.0
  shared_ui:
    path: packages/shared_ui
  shared_services:
    path: packages/shared_services
