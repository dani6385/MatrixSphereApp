name: matrix_sphere
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

workspace:
  - packages/shared_services
  - packages/shared_ui
  - apps/seller_sphere # Pastikan semua paket ada di sini

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^2.31.0
  firebase_crashlytics: ^3.5.0
  firebase_database: ^10.5.5

  go_router: ^13.2.0
  shared_preferences: ^2.3.2
  permission_handler: ^12.0.3
  google_nav_bar: ^5.0.7
  intl: ^0.19.0
  provider: ^6.1.5+1
  
  camera: ^0.10.6
  logger: ^2.4.0

  shared_services:
    path: packages/shared_services
  shared_ui:
    path: packages/shared_ui
  curved_navigation_bar: ^1.0.6
  table_calendar: ^3.1.3
  cross_file: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Menyelaraskan versi dengan paket lain di workspace
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
     - images/img_profile-avatar.jpg
