name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

workspace:
  - apps/*
  - packages/*

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.2
  google_nav_bar: ^5.0.7
  provider: ^6.1.2
  shared_ui: 
    path: packages/shared_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
