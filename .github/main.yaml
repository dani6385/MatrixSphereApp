name: Consolidated Monorepo Multiplatform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
# 1. JOB TO DETECT CHANGES
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seller_sphere:
              - 'apps/seller_sphere/**'
            matrix_sphere:
              - 'lib/**'

      - name: Generate Dynamic Matrix JSON
        id: set-matrix
        run: |
          MATRIX="[]"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='["seller_sphere", "matrix_sphere"]'
          else
            SELLER="${{ steps.filter.outputs.seller_sphere }}"
            MATRIX_SPHERE="${{ steps.filter.outputs.matrix_sphere }}"

            LIST=()
            [ "$SELLER" = "true" ] && LIST+=('"seller_sphere"')
            [ "$MATRIX_SPHERE" = "true" ] && LIST+=('"matrix_sphere"')

            if [ ${#LIST[@]} -gt 0 ]; then
              IFS=,
              MATRIX="[${LIST[*]}]"
            fi
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT


# 2. UNIFIED MULTIPLATFORM BUILD JOB
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
        platform: [web, android, windows, linux, macos]
# Pemetaan OS yang eksplisit dan aman:
        include:
          - platform: web
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project & Platform Variables
        id: vars
        shell: bash
        run: |
          PROJECT="${{ matrix.project }}"
          PLATFORM="${{ matrix.platform }}"
          
          if [ "$PROJECT" = "seller_sphere" ]; then
            DIR="apps/seller_sphere"
            echo "dir=$DIR" >> $GITHUB_OUTPUT
            echo "site=ss-seller-sph" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.FIREBASE_APP_ID_SELLER }}" >> $GITHUB_OUTPUT
          elif [ "$PROJECT" = "matrix_sphere" ]; then
            DIR="."
            echo "dir=$DIR" >> $GITHUB_OUTPUT
            echo "site=ms-matrix-sphere" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.FIREBASE_APP_ID_MATRIX }}" >> $GITHUB_OUTPUT
          fi

          if [ "$PLATFORM" = "windows" ]; then
            echo "artifact_path=$DIR/build/windows/x64/runner/Release" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "linux" ]; then
            echo "artifact_path=$DIR/build/linux/x64/release/bundle" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "macos" ]; then
            echo "artifact_path=$DIR/build/macos/Build/Products/Release" >> $GITHUB_OUTPUT
          fi

# --- ENVIRONMENT SETUP ---
      - name: Set up Java 17 for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up MSVC C++ Compiler (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Downgrade CMake for Windows
        if: matrix.platform == 'windows'
        run: choco install cmake --version=3.26.4 --allow-downgrade --yes --force
# KUNCI 3: Langkah krusial mengonfigurasi MSVC C++ Compiler agar terbaca oleh shell Bash di Windows
      - name: Set up MSVC Developer Command Prompt (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
# --- SETUP FLUTTER (Menggunakan versi stable terbaru) ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

# --- BUILD PROCESS ---
      - name: Configure Flutter for ${{ matrix.platform }}
        shell: bash
        run: |
          cd ${{ steps.vars.outputs.dir }}
          if [ "${{ matrix.platform }}" = "web" ]; then
            flutter config --enable-web
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            flutter config --enable-windows-desktop
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            flutter config --enable-linux-desktop
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            flutter config --enable-macos-desktop
            flutter config --no-enable-swift-package-manager
            flutter create . --platforms=macos
            if [ -f "macos/Podfile" ]; then
              sed -i '' "s/# platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
              sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
              sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = 10.14;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g" macos/Runner.xcodeproj/project.pbxproj
            fi
          fi
          
      - name: Get Dependencies
        shell: bash
        run: |
          cd ${{ steps.vars.outputs.dir }}
          if [ "${{ matrix.platform }}" = "android" ]; then
            flutter clean
          fi
          flutter pub get

      - name: Build ${{ matrix.project }} for ${{ matrix.platform }}
        shell: bash
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECAT_WARNINGS"
          # Tentukan API key berdasarkan platform yang sedang di-build
          API_KEY: ${{ (matrix.platform == 'web' && secrets.GOOGLE_MAPS_API_KEY_WEB) || \
                       (matrix.platform == 'android' && secrets.GOOGLE_MAPS_API_KEY_ANDROID) || \
                       (matrix.platform == 'linux' && secrets.GOOGLE_MAPS_API_KEY_LINUX) || \
                       (matrix.platform == 'windows' && secrets.GOOGLE_MAPS_API_KEY_WINDOWS) || \
                       (matrix.platform == 'macos' && secrets.GOOGLE_MAPS_API_KEY_MACOS) || \
                       '' }}
        run: |
          cd ${{ steps.vars.outputs.dir }}

          # Siapkan semua flag --dart-define
          DART_DEFINES="--dart-define=GOOGLE_MAPS_API_KEY=${API_KEY}"
          DART_DEFINES="$DART_DEFINES --dart-define=IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}"
          DART_DEFINES="$DART_DEFINES --dart-define=DEFAULT_STREAM_KEY=${{ secrets.DEFAULT_STREAM_KEY }}"

          echo "Building with defines: $DART_DEFINES"

          if [ "${{ matrix.platform }}" = "android" ]; then
            # Untuk Android, teruskan key ke Gradle menggunakan properti -P
            # dan juga ke Dart menggunakan --dart-define
            flutter build apk --release $DART_DEFINES -Ptarget="lib/main.dart" -Pgoogle-maps-api-key="${API_KEY}"
          else
            flutter build ${{ matrix.platform }} --release $DART_DEFINES
          fi
      
# --- DEPLOYMENT ---
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        if: matrix.platform == 'web' || matrix.platform == 'android'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting (Web)
        if: matrix.platform == 'web'
        run: npx firebase-tools@latest deploy --only "hosting:${{ steps.vars.outputs.site }}" --project "matrixsphere-c3de9"

      - name: Deploy to App Distribution (Android)
        if: matrix.platform == 'android'
        shell: bash
        run: |
          APK_PATH=$(find ${{ steps.vars.outputs.dir }} -name "app-release.apk" | head -n 1)
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            # --app "${{ steps.vars.outputs.app_id }}" \
            --app "${{ secrets.app_id }}" \ 
            --groups "sphere" \
            --project "matrixsphere-c3de9"

# Unggah hasil kompilasi macOS ke artifact penyimpanan bersama dengan Windows & Linux
      - name: Upload Desktop Artifacts
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}-build
          path: ${{ steps.vars.outputs.artifact_path }}