name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter clean
          flutter pub get
          flutter build apk --release

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'
      
      - name: Deploy to Firebase App Distribution
        run: |
          APK_PATH=$(find ${{ steps.vars.outputs.dir }} -name "app-release.apk" | head -n 1)
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            --app "${{ steps.vars.outputs.app_id }}" \
            --groups "sphere" \
            --project "matrixsphere-c3de9"

  build-windows:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        shell: bash
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Downgrade CMake (Fix Firebase Compatibility)
        run: choco install cmake --version=3.26.4 --allow-downgrade --yes --force

      - name: Build Windows App
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECAT_WARNINGS"
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-windows-build
          path: ${{ steps.vars.outputs.dir }}/build/windows/x64/runner/Release

  build-linux:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
          esac

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Linux App
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-build
          path: ${{ steps.vars.outputs.dir }}/build/linux/x64/release/bundle

  build-macos:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere")
              echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT
              ;;
            "matrix_sphere")
              echo "dir=." >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS App
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release
      
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-macos-build
          path: ${{ steps.vars.outputs.dir }}/build/macos/Build/Products/Release
