on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_hotspot/**'
      - 'apps/admin_mikrotik/**'
      - 'pubspec.yaml'

jobs:
  build-hotspot:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/client_hotspot/')
    steps:
      - uses: actions/checkout@v4
      
      # Tambahkan Cache di sini
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client_hotspot/.gradle
          key: ${{ runner.os }}-hotspot-${{ hashFiles('apps/client_hotspot/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-hotspot-

      - uses: subosito/flutter-action@v2
      - run: |
          cd apps/client_hotspot
          flutter pub get
          flutter build apk --release

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }} 
          file: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk

  build-admin:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/admin_mikrotik/')
    steps:
      - uses: actions/checkout@v4
      
      # Tambahkan Cache di sini
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/admin_mikrotik/.gradle
          key: ${{ runner.os }}-admin-${{ hashFiles('apps/admin_mikrotik/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-admin-

      - uses: subosito/flutter-action@v2
      - run: |
          cd apps/admin_mikrotik
          flutter pub get
          flutter build apk --release

      - uses: softprops/action-gh-release@v1
        with:
          files: apps/admin_mikrotik/build/app/outputs/flutter-apk/app-release.apk
          tag_name: admin-v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}