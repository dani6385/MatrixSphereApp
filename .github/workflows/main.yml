name: Sequential Monorepo Multiplatform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. JOB DETEKSI PERUBAHAN
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seller_sphere:
              - 'apps/seller_sphere/**'
            client_connectivity:
              - 'apps/client_connectivity/**'
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
            matrix_sphere:
              - 'lib/**'
            shop_sphere:
              - 'apps/shop_sphere/**'

      - name: Generate Dynamic Matrix JSON
        id: set-matrix
        run: |
          MATRIX="[]"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='["seller_sphere", "client_connectivity", "admin_mikrotik", "matrix_sphere", "shop_sphere"]'
          else
            SELLER="${{ steps.filter.outputs.seller_sphere }}"
            CLIENT="${{ steps.filter.outputs.client_connectivity }}"
            ADMIN="${{ steps.filter.outputs.admin_mikrotik }}"
            MATRIX_SPHERE="${{ steps.filter.outputs.matrix_sphere }}"
            SHOP="${{ steps.filter.outputs.shop_sphere }}"

            LIST=()
            [ "$SELLER" = "true" ] && LIST+=('"seller_sphere"')
            [ "$CLIENT" = "true" ] && LIST+=('"client_connectivity"')
            [ "$ADMIN" = "true" ] && LIST+=('"admin_mikrotik"')
            [ "$MATRIX_SPHERE" = "true" ] && LIST+=('"matrix_sphere"')
            [ "$SHOP" = "true" ] && LIST+=('"shop_sphere"')

            if [ ${#LIST[@]} -gt 0 ]; then
              IFS=,
              MATRIX="[${LIST[*]}]"
            fi
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT


  # 2. JOB BUILD WEB (Berjalan pertama setelah deteksi selesai)
  build-web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web Application
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-web
          flutter build web --release

      - name: Verifikasi Deteksi Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "EROR: Secret FIREBASE_SERVICE_ACCOUNT tidak ditemukan di repositori ini!"
            exit 1
          else
            echo "OK: Secret FIREBASE_SERVICE_ACCOUNT berhasil dideteksi."
          fi
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: deploy --only hosting --project matrixsphere-c3de9
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_PATH: ${{ steps.vars.outputs.dir }}


  # 3. JOB BUILD ANDROID (Hanya berjalan jika build-web telah sukses selesai)
  build-android:
    needs: [detect-changes, build-web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere")
              echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_SELLER }}" >> $GITHUB_OUTPUT
              ;;
            "client_connectivity")
              echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_CLIENT }}" >> $GITHUB_OUTPUT
              ;;
            "admin_mikrotik")
              echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_ADMIN }}" >> $GITHUB_OUTPUT
              ;;
            "matrix_sphere")
              echo "dir=." >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_MATRIX }}" >> $GITHUB_OUTPUT
              ;;
            "shop_sphere")
              echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_SHOP }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter build apk --release

      - name: Deploy to Firebase App Distribution
        run: |
          # 1. Cari file APK secara dinamis di direktori proyek
          # Menggunakan head -n 1 untuk memastikan hanya mengambil satu file jika ada duplikat
          APK_PATH=$(find ${{ steps.vars.outputs.dir }} -name "app-release.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file tidak ditemukan di ${{ steps.vars.outputs.dir }}"
            exit 1
          fi
          
          echo "Deploying $APK_PATH to Firebase..."

          # 2. Deploy menggunakan Firebase Token dan App ID yang sesuai
          # Kita tidak lagi menggunakan GCS_SA_KEY untuk menghindari error 403
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            --app "${{ steps.vars.outputs.app_id }}" \
            --groups "seller" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --project "matrixsphere-c3de9"

  # 4. JOB BUILD WINDOWS (Menunggu build-android selesai)
  build-windows:
    needs: [detect-changes, build-android]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        shell: bash
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Windows App
        shell: bash
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-windows-build
          path: ${{ steps.vars.outputs.dir }}/build/windows/x64/runner/Release


  # 5. JOB BUILD LINUX (Menunggu build-windows selesai)
  build-linux:
    needs: [detect-changes, build-windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Linux App
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-build
          path: ${{ steps.vars.outputs.dir }}/build/linux/x64/release/bundle


  # 6. JOB BUILD MACOS (Menunggu build-linux selesai)
  build-macos:
    needs: [detect-changes, build-linux]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS App
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-macos-build
          path: ${{ steps.vars.outputs.dir }}/build/macos/Build/Products/Release