name: Sequential Monorepo Multiplatform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: 'read'
  id-token: 'write'
jobs:
  # 1. JOB DETEKSI PERUBAHAN
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seller_sphere:
              - 'apps/seller_sphere/**'
            client_connectivity:
              - 'apps/client_connectivity/**'
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
            matrix_sphere:
              - 'lib/**'
            shop_sphere:
              - 'apps/shop_sphere/**'

      - name: Generate Dynamic Matrix JSON
        id: set-matrix
        run: |
          MATRIX="[]"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='["seller_sphere", "client_connectivity", "admin_mikrotik", "matrix_sphere", "shop_sphere"]'
          else
            SELLER="${{ steps.filter.outputs.seller_sphere }}"
            CLIENT="${{ steps.filter.outputs.client_connectivity }}"
            ADMIN="${{ steps.filter.outputs.admin_mikrotik }}"
            MATRIX_SPHERE="${{ steps.filter.outputs.matrix_sphere }}"
            SHOP="${{ steps.filter.outputs.shop_sphere }}"

            LIST=()
            [ "$SELLER" = "true" ] && LIST+=('"seller_sphere"')
            [ "$CLIENT" = "true" ] && LIST+=('"client_connectivity"')
            [ "$ADMIN" = "true" ] && LIST+=('"admin_mikrotik"')
            [ "$MATRIX_SPHERE" = "true" ] && LIST+=('"matrix_sphere"')
            [ "$SHOP" = "true" ] && LIST+=('"shop_sphere"')

            if [ ${#LIST[@]} -gt 0 ]; then
              IFS=,
              MATRIX="[${LIST[*]}]"
            fi
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT


  # 2. JOB BUILD WEB
  build-web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Build Web Application
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release

      # 1. Autentikasi menggunakan Workload Identity Federation (WIF)
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'

      # 2. Deploy ke Firebase Hosting secara Keyless
      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting --project "matrixsphere-c3de9"


  # 3. JOB BUILD ANDROID
  build-android:
    needs: [detect-changes, build-web]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere")
              echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_SELLER }}" >> $GITHUB_OUTPUT
              ;;
            "client_connectivity")
              echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_CLIENT }}" >> $GITHUB_OUTPUT
              ;;
            "admin_mikrotik")
              echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_ADMIN }}" >> $GITHUB_OUTPUT
              ;;
            "matrix_sphere")
              echo "dir=." >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_MATRIX }}" >> $GITHUB_OUTPUT
              ;;
            "shop_sphere")
              echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT
              echo "app_id=${{ secrets.FIREBASE_APP_ID_SHOP }}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.0' # <-- GANTI DENGAN VERSI FLUTTER LAPTOP ANDA (misal: 3.22.2, 3.24.0, dll)
          cache: true

      # Menghapus kondisi "matrix.should_run" yang tidak terdefinisi agar build tidak terlewati
      - name: Build Android APK
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter clean
          flutter pub upgrade --major-versions
          flutter build apk --release

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'
      
      - name: Deploy to Firebase App Distribution
        run: |
          # 1. Tidak perlu lagi menulis file gcp_key.json dari secrets!
          
          # 2. Cari file APK
          APK_PATH=$(find ${{ steps.vars.outputs.dir }} -name "app-release.apk" | head -n 1)
          
          # ... (sisanya tetap sama) ...
          
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            --app "${{ steps.vars.outputs.app_id }}" \
            --groups "sphere" \
            --project "matrixsphere-c3de9"


  # 4. JOB BUILD WINDOWS
  build-windows:
    needs: [detect-changes, build-android]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        shell: bash
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      # Downgrade CMake untuk menghindari error ketidakcocokan versi lama Firebase SDK
      - name: Downgrade CMake (Fix Firebase Compatibility)
        run: choco install cmake --version=3.26.4 --allow-downgrade --yes --force

      # Menggabungkan dan membersihkan duplikasi langkah Build Windows App Anda
      - name: Build Windows App
        # TAMBAHKAN BLOK ENV DI BAWAH INI
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECAT_WARNINGS"
        run: |
          # 1. Aktifkan desktop Windows
          flutter config --enable-windows-desktop
          
          # 2. Mulai proses build release
          flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-windows-build
          path: ${{ steps.vars.outputs.dir }}/build/windows/x64/runner/Release


  # 5. JOB BUILD LINUX
  build-linux:
    needs: [detect-changes, build-windows]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Project Variables
        id: vars
        run: |
          PROJECT="${{ matrix.project }}"
          case "$PROJECT" in
            "seller_sphere") echo "dir=apps/seller_sphere" >> $GITHUB_OUTPUT ;;
            "client_connectivity") echo "dir=apps/client_connectivity" >> $GITHUB_OUTPUT ;;
            "admin_mikrotik") echo "dir=apps/admin_mikrotik" >> $GITHUB_OUTPUT ;;
            "matrix_sphere") echo "dir=." >> $GITHUB_OUTPUT ;;
            "shop_sphere") echo "dir=apps/shop_sphere" >> $GITHUB_OUTPUT ;;
          esac

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.6'
          cache: true

      - name: Build Linux App
        run: |
          cd ${{ steps.vars.outputs.dir }}
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-build
          path: ${{ steps.vars.outputs.dir }}/build/linux/x64/release/bundle


  # 6. JOB BUILD MACOS
  build-macos:
    needs: [detect-changes, build-linux]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' && false }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PASTIKAN BLOK "Set up Flutter" INI ADA DI SINI
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      # Langkah menonaktifkan SPM sebelum build dimulai
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # Langkah build macOS otomatis kita sebelumnya
      - name: Build macOS App
        run: |
          # 1. Aktifkan dukungan macOS desktop
          flutter config --enable-macos-desktop
          
          # 2. Generate ulang folder macos yang bersih langsung di mesin runner Mac
          flutter create . --platforms=macos
          
          # 3. Otomatis ubah target platform di Podfile menjadi 10.15
          sed -i '' "s/# platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
          sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
          
          # 4. Otomatis ubah target deployment di project.pbxproj menjadi 10.15
          sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = 10.14;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g" macos/Runner.xcodeproj/project.pbxproj
          
          # 5. Jalankan pub get untuk mengonfigurasi dependensi baru
          flutter pub get
          
          # 6. Mulai proses build release
          flutter build macos --release