name: Build Selective Flutter Apps

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin_mikrotik: ${{ steps.filter.outputs.admin_mikrotik }}
      client_hotspot: ${{ steps.filter.outputs.client_hotspot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use path filter action
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
            client_hotspot:
              - 'apps/client_hotspot/**'

  build_admin_mikrotik:
    needs: changes
    if: ${{ needs.changes.outputs.admin_mikrotik == 'true' }}
    name: Build Admin Mikrotik App
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # OPTIMASI: Menambahkan cache untuk Flutter SDK
      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Menambahkan cache untuk Flutter SDK

      - name: 3. Get dependencies for Admin app
        run: flutter pub get
        working-directory: ./apps/admin_mikrotik

      - name: 4. Build APK for Admin app
        run: flutter build apk --release
        working-directory: ./apps/admin_mikrotik

      - name: 5. Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-mikrotik-release.apk
          path: apps/admin_mikrotik/build/app/outputs/flutter-apk/app-release.apk

  build_client_hotspot:
    needs: changes
    if: ${{ needs.changes.outputs.client_hotspot == 'true' }}
    name: Build Client Hotspot App
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # OPTIMASI: Menambahkan cache untuk Flutter SDK
      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Menambahkan cache untuk Flutter SDK

      - name: 3. Get dependencies for Client app
        run: flutter pub get
        working-directory: ./apps/client_hotspot

      - name: 4. Build APK for Client app
        run: flutter build apk --release
        working-directory: ./apps/client_hotspot

      - name: 5. Upload Client APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-hotspot-release.apk
          path: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk
