name: Build & Distribute Flutter Apps

on:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin_mikrotik: ${{ steps.filter.outputs.admin_mikrotik }}
      client_hotspot: ${{ steps.filter.outputs.client_hotspot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use path filter action
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
            client_hotspot:
              - 'apps/client_hotspot/**'

  build_and_deploy_admin:
    needs: changes
    if: ${{ needs.changes.outputs.admin_mikrotik == 'true' }}
    name: Build & Deploy Admin Mikrotik
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Get dependencies
        run: flutter pub get
        working-directory: ./apps/admin_mikrotik

      - name: 4. Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 5. Build APK
        run: flutter build apk --release
        working-directory: ./apps/admin_mikrotik

      # PERBAIKAN: Mengganti nama action dengan kapitalisasi yang benar
      - name: 6. Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ADMIN }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/admin_mikrotik/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Build from commit ${{ github.sha }}"

  build_and_deploy_client:
    needs: changes
    if: ${{ needs.changes.outputs.client_hotspot == 'true' }}
    name: Build & Deploy Client Hotspot
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Get dependencies
        run: flutter pub get
        working-directory: ./apps/client_hotspot

      - name: 4. Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 5. Build APK
        run: flutter build apk --release
        working-directory: ./apps/client_hotspot

      # PERBAIKAN: Mengganti nama action dengan kapitalisasi yang benar
      - name: 6. Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_CLIENT }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Build from commit ${{ github.sha }}"
