# Nama Alur Kerja (Workflow)
name: Build and Distribute Flutter App

# Pemicu (Trigger)
on:
  # Baris ini SANGAT PENTING. Ini yang membuat alur kerja bisa dijalankan manual.
  workflow_dispatch:
    inputs:
      app:
        description: 'Pilih aplikasi yang akan di-build dan deploy'
        required: true
        type: choice
        options:
        - client_hotspot
        - admin_mikrotik

# Daftar pekerjaan (Jobs) yang akan dijalankan
jobs:
  build_and_deploy:
    # Menjalankan pada environment Ubuntu terbaru
    runs-on: ubuntu-latest

    steps:
      # 1. Mengunduh kode dari repositori Anda
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan environment Java yang diperlukan untuk build Android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Menyiapkan environment Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Mengambil semua dependensi Flutter dari root project
      - name: Get root Flutter dependencies
        run: flutter pub get
      
      # 5. Mengambil dependensi spesifik untuk aplikasi yang dipilih
      - name: Get app-specific dependencies
        working-directory: ./apps/${{ github.event.inputs.app }}
        run: flutter pub get

      # 6. Membersihkan project build sebelumnya (opsional, tapi disarankan)
      - name: Clean Flutter project
        working-directory: ./apps/${{ github.event.inputs.app }}
        run: flutter clean

      # 7. Membangun APK rilis untuk aplikasi yang dipilih
      - name: Build APK for selected app
        working-directory: ./apps/${{ github.event.inputs.app }}
        run: flutter build apk --release

      # 8. Mengunggah APK client_hotspot ke Firebase App Distribution
      - name: Upload Client App to Firebase App Distribution
        if: github.event.inputs.app == 'client_hotspot'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_CLIENT }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk

      # 9. Mengunggah APK admin_mikrotik ke Firebase App Distribution
      - name: Upload Admin App to Firebase App Distribution
        if: github.event.inputs.app == 'admin_mikrotik'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ADMIN }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: apps/admin_mikrotik/build/app/outputs/flutter-apk/app-release.apk
