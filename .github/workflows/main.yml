name: Build, Deploy & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_hotspot/**'
      - 'apps/admin_mikrotik/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  # Job 1: Build Admin MikroTik
  build-admin:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/admin_mikrotik/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache dependencies Admin
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/admin_mikrotik/.gradle
          key: ${{ runner.os }}-admin-${{ hashFiles('apps/admin_mikrotik/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-admin-

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x' }

      - run: |
          cd apps/admin_mikrotik
          flutter pub get
          flutter build apk --release

      - name: Upload Admin ke Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ADMIN_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/admin_mikrotik/build/app/outputs/flutter-apk/app-release.apk

# Job 2: Build Hotspot Client
  build-hotspot:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/client_hotspot/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache dependencies Client
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            apps/client_hotspot/.gradle
          key: ${{ runner.os }}-hotspot-${{ hashFiles('apps/client_hotspot/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-hotspot-

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.x' }

      - run: |
          cd apps/client_hotspot
          flutter pub get
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk
