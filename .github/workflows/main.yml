name: Sequential Monorepo Multiplatform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: 'read'
  id-token: 'write'
jobs:
  # 1. JOB DETEKSI PERUBAHAN
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seller_sphere:
              - 'apps/seller_sphere/**'
            client_connectivity:
              - 'apps/client_connectivity/**'
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
            # matrix_sphere:
              # - 'lib/**'
            shop_sphere:
              - 'apps/shop_sphere/**'
            matrix_sphere:
              - 'apps/matrix_sphere/**'

      - name: Generate Dynamic Matrix JSON
        id: set-matrix
        run: |
          BASE_MATRIX='[
            {"project": "seller_sphere", "dir": "apps/seller_sphere", "site": "ss-seller-sph", "app_id": "${{ secrets.FIREBASE_APP_ID_SELLER }}"},
            {"project": "client_connectivity", "dir": "apps/client_connectivity", "site": "cc-client-connet", "app_id": "${{ secrets.FIREBASE_APP_ID_CLIENT }}"},
            {"project": "admin_mikrotik", "dir": "apps/admin_mikrotik", "site": "admin-mikrotik", "app_id": "${{ secrets.FIREBASE_APP_ID_ADMIN }}"},
            {"project": "matrix_sphere", "dir": "apps/matrix_sphere", "site": "ms-matrix-sphere", "app_id": "${{ secrets.FIREBASE_APP_ID_MATRIX }}"},
            {"project": "shop_sphere", "dir": "apps/shop_sphere", "site": "ss-shop-sph", "app_id": "${{ secrets.FIREBASE_APP_ID_SHOP }}"}
          ]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "matrix=$BASE_MATRIX" >> $GITHUB_OUTPUT
          else
            CHANGED_PROJECTS=""
            ${{ steps.filter.outputs.seller_sphere }} && CHANGED_PROJECTS="$CHANGED_PROJECTS seller_sphere"
            ${{ steps.filter.outputs.client_connectivity }} && CHANGED_PROJECTS="$CHANGED_PROJECTS client_connectivity"
            ${{ steps.filter.outputs.admin_mikrotik }} && CHANGED_PROJECTS="$CHANGED_PROJECTS admin_mikrotik"
            ${{ steps.filter.outputs.matrix_sphere }} && CHANGED_PROJECTS="$CHANGED_PROJECTS matrix_sphere"
            ${{ steps.filter.outputs.shop_sphere }} && CHANGED_PROJECTS="$CHANGED_PROJECTS shop_sphere"
            
            FILTERED_MATRIX=$(echo "$BASE_MATRIX" | jq --arg projects "$CHANGED_PROJECTS" '[.[] | select(.project as $p | $projects | contains($p))]')
            echo "matrix=$FILTERED_MATRIX" >> $GITHUB_OUTPUT
          fi


  # 2. JOB BUILD WEB
  build-web:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2' # Consistent Flutter version
          cache: true

      - name: Build Web Application
        run: |
          cd ${{ matrix.dir }}
          flutter config --enable-web
          flutter pub get
          flutter build web --release

      # 1. Autentikasi menggunakan Workload Identity Federation (WIF)
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'

      # 2. Deploy ke Firebase Hosting secara Keyless
      - name: Deploy to Firebase Hosting
        run: |
          npx firebase-tools@latest deploy --only "hosting:${{ matrix.site }}" --project "matrixsphere-c3de9"


  # 3. JOB BUILD ANDROID
  build-android:
    needs: [detect-changes, build-web]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2' # Consistent Flutter version
          cache: true

      - name: Build Android APK
        run: |
          cd ${{ matrix.dir }}
          flutter clean
          flutter pub get
          flutter build apk --release

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'
      
      - name: Deploy to Firebase App Distribution
        run: |
          # 1. Tidak perlu lagi menulis file gcp_key.json dari secrets!
          
          # 2. Cari file APK
          APK_PATH=$(find ${{ matrix.dir }} -name "app-release.apk" | head -n 1)
          
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            --app "${{ matrix.app_id }}" \
            --groups "sphere" \
            --project "matrixsphere-c3de9"


  # 4. JOB BUILD WINDOWS
  build-windows:
    needs: [detect-changes, build-android]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2' # Consistent Flutter version
          cache: true

      # Downgrade CMake untuk menghindari error ketidakcocokan versi lama Firebase SDK
      - name: Downgrade CMake (Fix Firebase Compatibility)
        run: choco install cmake --version=3.26.4 --allow-downgrade --yes --force

      # Menggabungkan dan membersihkan duplikasi langkah Build Windows App Anda
      - name: Build Windows App
        # TAMBAHKAN BLOK ENV DI BAWAH INI
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECAT_WARNINGS"
        run: |
          cd ${{ matrix.dir }}
          
          # 1. Dapatkan dependensi
          flutter pub get

          # 2. Aktifkan desktop Windows
          flutter config --enable-windows-desktop
          
          # 3. Mulai proses build release
          flutter build windows --release

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-windows-build
          path: ${{ matrix.dir }}/build/windows/x64/runner/Release


  # 5. JOB BUILD LINUX
  build-linux:
    needs: [detect-changes, build-windows]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.2' # Consistent Flutter version
          cache: true

      - name: Build Linux App
        run: |
          cd ${{ matrix.dir }}
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-build
          path: ${{ matrix.dir }}/build/linux/x64/release/bundle


  # 6. JOB BUILD MACOS
  build-macos:
    needs: [detect-changes, build-linux]
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' && false }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # PASTIKAN BLOK "Set up Flutter" INI ADA DI SINI
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # Consistent Flutter version
          channel: 'stable'

      # Langkah menonaktifkan SPM sebelum build dimulai
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # Langkah build macOS otomatis kita sebelumnya
      - name: Build macOS App
        run: |
          cd ${{ matrix.dir }}

          # 1. Aktifkan dukungan macOS desktop
          flutter config --enable-macos-desktop
          
          # 2. Generate ulang folder macos yang bersih langsung di mesin runner Mac
          flutter create . --platforms=macos
          
          # 3. Otomatis ubah target platform di Podfile menjadi 10.15
          sed -i '' "s/# platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
          sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
          
          # 4. Otomatis ubah target deployment di project.pbxproj menjadi 10.15
          sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = 10.14;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g" macos/Runner.xcodeproj/project.pbxproj
          
          # 5. Jalankan pub get untuk mengonfigurasi dependensi baru
          flutter pub get
          
          # 6. Mulai proses build release
          flutter build macos --release