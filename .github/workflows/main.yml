name: Consolidated Monorepo Multiplatform Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # 1. JOB DETEKSI PERUBAHAN
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seller_sphere:
              - 'apps/seller_sphere/**'
            matrix_sphere:
              - 'lib/**'

      - name: Generate Dynamic Matrix JSON
        id: set-matrix
        run: |
          MATRIX="[]"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX='["seller_sphere", "matrix_sphere"]'
          else
            SELLER="${{ steps.filter.outputs.seller_sphere }}"
            MATRIX_SPHERE="${{ steps.filter.outputs.matrix_sphere }}"

            LIST=()
            [ "$SELLER" = "true" ] && LIST+=('"seller_sphere"')
            [ "$MATRIX_SPHERE" = "true" ] && LIST+=('"matrix_sphere"')

            if [ ${#LIST[@]} -gt 0 ]; then
              IFS=,
              MATRIX="[${LIST[*]}]"
            fi
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT


  # 2. JOB BUILD MULTIPLATFORM (Telah Disatukan)
  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    
    # Menentukan sistem operasi secara dinamis berdasarkan platform target
    runs-on: ${{ (matrix.platform == 'windows' && 'windows-latest') || (matrix.platform == 'macos' && 'macos-latest') || 'ubuntu-latest' }}
    
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
        # Masukkan semua platform yang ingin di-build di sini (Aktifkan 'macos' jika diperlukan nanti)
        platform: [web, android, windows, linux] 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mengidentifikasi variabel folder proyek dan target rilis (menggunakan bash agar kompatibel di semua OS)
      - name: Resolve Project & Platform Variables
        id: vars
        shell: bash
        run: |
          PROJECT="${{ matrix.project }}"
          PLATFORM="${{ matrix.platform }}"
          
          # Tentukan direktori kerja utama
          if [ "$PROJECT" = "seller_sphere" ]; then
            DIR="apps/seller_sphere"
            echo "dir=$DIR" >> $GITHUB_OUTPUT
            echo "site=ss-seller-sph" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.FIREBASE_APP_ID_SELLER }}" >> $GITHUB_OUTPUT
          else
            DIR="."
            echo "dir=$DIR" >> $GITHUB_OUTPUT
            echo "site=ms-matrix-sphere" >> $GITHUB_OUTPUT
            echo "app_id=${{ secrets.FIREBASE_APP_ID_MATRIX }}" >> $GITHUB_OUTPUT
          fi

          # Tentukan lokasi artifact khusus untuk desktop
          if [ "$PLATFORM" = "windows" ]; then
            echo "artifact_path=$DIR/build/windows/x64/runner/Release" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "linux" ]; then
            echo "artifact_path=$DIR/build/linux/x64/release/bundle" >> $GITHUB_OUTPUT
          elif [ "$PLATFORM" = "macos" ]; then
            echo "artifact_path=$DIR/build/macos/Build/Products/Release" >> $GITHUB_OUTPUT
          fi

      # Setup Java (Hanya dijalankan saat build Android)
      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Setup dependensi Linux (Hanya dijalankan saat build Linux)
      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # Downgrade CMake (Hanya dijalankan saat build Windows)
      - name: Downgrade CMake (Fix Firebase Compatibility)
        if: matrix.platform == 'windows'
        run: choco install cmake --version=3.26.4 --allow-downgrade --yes --force

      # --- SETUP FLUTTER (Hanya ditulis 1 kali untuk semua platform) ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.6'
          cache: true

      # Langkah kompilasi aplikasi berdasarkan platform masing-masing
      - name: Build Application
        shell: bash
        env:
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECAT_WARNINGS"
        run: |
          cd ${{ steps.vars.outputs.dir }}
          
          # Konfigurasi platform spesifik sebelum kompilasi
          if [ "${{ matrix.platform }}" = "web" ]; then
            flutter config --enable-web
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            flutter config --enable-windows-desktop
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            flutter config --enable-linux-desktop
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            flutter config --enable-macos-desktop
            flutter config --no-enable-swift-package-manager
            # Penyesuaian Podfile khusus macOS
            if [ -f "macos/Podfile" ]; then
              sed -i '' "s/# platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
              sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/g" macos/Podfile
              sed -i '' "s/MACOSX_DEPLOYMENT_TARGET = 10.14;/MACOSX_DEPLOYMENT_TARGET = 10.15;/g" macos/Runner.xcodeproj/project.pbxproj
            fi
          fi

          # Bersihkan cache Gradle untuk Android
          if [ "${{ matrix.platform }}" = "android" ]; then
            flutter clean
          fi

          flutter pub get

          # Eksekusi kompilasi akhir
          if [ "${{ matrix.platform }}" = "android" ]; then
            flutter build apk --release
          else
            flutter build ${{ matrix.platform }} --release
          fi

      # GCP Authentication (Hanya untuk Web dan Android guna kebutuhan Firebase)
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        if: matrix.platform == 'web' || matrix.platform == 'android'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/359008687014/locations/global/workloadIdentityPools/github-matrixsphere-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-c3de9.iam.gserviceaccount.com'

      # Deploy ke Firebase Hosting (Hanya untuk Web)
      - name: Deploy to Firebase Hosting
        if: matrix.platform == 'web'
        run: |
          npx firebase-tools@latest deploy --only "hosting:${{ steps.vars.outputs.site }}" --project "matrixsphere-c3de9"

      # Deploy ke Firebase App Distribution (Hanya untuk Android)
      - name: Deploy to Firebase App Distribution
        if: matrix.platform == 'android'
        shell: bash
        run: |
          APK_PATH=$(find ${{ steps.vars.outputs.dir }} -name "app-release.apk" | head -n 1)
          npx firebase-tools appdistribution:distribute "$APK_PATH" \
            --app "${{ steps.vars.outputs.app_id }}" \
            --groups "sphere" \
            --project "matrixsphere-c3de9"

      # Upload Artifact untuk Windows, Linux, dan macOS
      - name: Upload Desktop Artifacts
        if: matrix.platform == 'windows' || matrix.platform == 'linux' || matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}-build
          path: ${{ steps.vars.outputs.artifact_path }}