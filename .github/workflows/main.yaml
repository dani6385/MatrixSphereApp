name: Build & Release to Repo Home

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_hotspot/**'
      - 'pubspec.yaml'
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Setup Java & Flutter
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: Build APK
        run: |
          cd apps/client_hotspot
          flutter build apk --release --build-number=${{ github.run_number }}

      # Upload ke Releases agar muncul di Halaman Depan
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Versi Baru - Build ${{ github.run_number }}
          body: "APK terbaru tersedia untuk diunduh."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}