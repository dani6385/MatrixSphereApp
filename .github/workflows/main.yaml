name: Build Flutter APK & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # 1. Setup Java (Diperlukan untuk Android build)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Setup Flutter dengan cache yang dioptimalkan
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          cache: true # Mengaktifkan caching untuk Flutter SDK

      # 3. Cache Pub dependencies
      - name: Cache Pub Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "APK otomatis dengan optimasi cache."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}