name: Build, Release Client Connectivity to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache Setup
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Setup Environment
      - name: Setup Java & Flutter
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Get dependencies
        run: |
          cd apps/client_connectivity
          flutter pub get

      # Build APK
      - name: Build APK
        id: build_apk
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties
          cd apps/client_connectivity
          flutter build apk --release --build-number=${{ github.run_number }} --verbose

      # 1. UPLOAD KE FIREBASE APP DISTRIBUTION
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk

      # 2. UPLOAD KE GITHUB RELEASES (Home Repo)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
          tag_name: client-connectivity-v1.0.${{ github.run_number }}
          name: Client Connectivity - Build ${{ github.run_number }}
          body: "APK terbaru telah diunggah ke Firebase App Distribution dan tersedia di sini."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}