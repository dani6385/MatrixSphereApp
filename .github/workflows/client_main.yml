name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  build_all:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-latest
            platform: android
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Cache Terpadu
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-build-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Fitur bawaan untuk mempercepat cache SDK

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/client_connectivity

      - name: Build ${{ matrix.platform }}
        run: flutter build ${{ matrix.platform }} --release
        working-directory: apps/client_connectivity