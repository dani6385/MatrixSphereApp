name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  # Langkah 1: Build Windows terlebih dahulu
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Windows
        run: flutter build windows --release
        working-directory: apps/client_connectivity

      - name: List build directory
        shell: powershell
        run: Get-ChildItem -Path "apps/client_connectivity/build/windows/x64/runner/Release/" -Recurse

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-windows
          path: apps/client_connectivity/build/windows/x64/runner/Release/

  # Langkah 2: Build Linux (setelah Windows selesai)
  build_linux:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release
        working-directory: apps/client_connectivity

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-linux
          path: apps/client_connectivity/build/linux/x64/release/bundle/

  build_and_deploy_web:
    
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          # Menggunakan token yang sudah terautentikasi via Workload Identity
          firebase deploy --only hosting --project matrixsphere-organisation --target client-sph-connect
        working-directory: apps/client_connectivity
        env:
          # Firebase CLI akan menggunakan kredensial dari step 'auth' secara otomatis
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
  # build Android
  build_and_release:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache Setup
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Setup Environment
      - name: Setup Java & Flutter
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      # Build APK
      - name: Build APK
        run: |
          cd apps/client_connectivity
          flutter build apk --release --build-number=${{ github.run_number }}

      # 1. UPLOAD KE FIREBASE APP DISTRIBUTION
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk

      # 2. UPLOAD KE GITHUB RELEASES (Home Repo)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Versi Baru - Build ${{ github.run_number }}
          body: "APK terbaru telah diunggah ke Firebase App Distribution dan tersedia di sini."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  