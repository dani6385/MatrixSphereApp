name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  # job windows
  build_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release
        working-directory: apps/client_connectivity

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release
        working-directory: apps/client_connectivity

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-client-${{ matrix.os }}
          path: |
            apps/client_connectivity/build/windows/runner/Release/
            apps/client_connectivity/build/linux/x64/release/bundle/
  # build Android
  build_and_release:
    needs: build_desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache Setup
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      # Setup Environment
      - name: Setup Java & Flutter
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      # Build APK
      - name: Build APK
        run: |
          cd apps/client_connectivity
          flutter build apk --release --build-number=${{ github.run_number }}

      # 1. UPLOAD KE FIREBASE APP DISTRIBUTION
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk

      # 2. UPLOAD KE GITHUB RELEASES (Home Repo)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Versi Baru - Build ${{ github.run_number }}
          body: "APK terbaru telah diunggah ke Firebase App Distribution dan tersedia di sini."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  