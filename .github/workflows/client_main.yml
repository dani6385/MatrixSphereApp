name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
  workflow_dispatch:

jobs:
  
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Windows
        run: flutter build windows --release
        working-directory: apps/client_connectivity

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-windows
          path: apps/client_connectivity/build/windows/x64/runner/Release/

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Linux
        working-directory: apps/client_connectivity
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-linux
          path: apps/client_connectivity/build/linux/x64/release/bundle/

  build_and_deploy_web:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity

      # --- PERBAIKAN SINTAKSIS DAN AUTENTIKASI ---
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-organisation.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        uses: firebase/firebase-tools-action@v0
        with:
          args: deploy --only hosting --project matrixsphere-organisation
        # Direktori kerja harus menunjuk ke folder yang berisi firebase.json
          working-directory: apps/client_connectivity

  build_and_release_android:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write' # Izin untuk membuat GitHub Release
      id-token: 'write'  # Izin untuk autentikasi ke Google Cloud
    steps:
      - uses: actions/checkout@v4

      # Cache Setup
      - name: Cache Gradle & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Setup Environment
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        working-directory: apps/client_connectivity

      # --- PERBAIKAN AUTENTIKASI ---
      - name: Authenticate to Google Cloud
        id: auth-android
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@matrixsphere-organisation.iam.gserviceaccount.com'

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          # Menggunakan file kredensial dari langkah auth, bukan token
          serviceCredentialsFile: ${{ steps.auth-android.outputs.credentials_file_path }}
          groups: testers
          file: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Versi Baru - Build ${{ github.run_number }}
          body: "APK terbaru telah diunggah ke Firebase App Distribution dan tersedia di sini."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
