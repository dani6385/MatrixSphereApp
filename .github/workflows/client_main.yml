name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  # Langkah 1: Build Windows terlebih dahulu
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Windows
        run: flutter build windows --release
        working-directory: apps/client_connectivity

      - name: List build directory
        shell: powershell
        run: Get-ChildItem -Path "apps/client_connectivity/build/windows/x64/runner/Release/" -Recurse

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-windows
          path: apps/client_connectivity/build/windows/x64/runner/Release/

  # Langkah 2: Build Linux (setelah Windows selesai)
  build_linux:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release
        working-directory: apps/client_connectivity

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-linux
          path: apps/client_connectivity/build/linux/x64/release/bundle/

  build_and_deploy_web:
    
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project matrixsphere-c3de9 --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: apps/client_connectivity
        
        # build Android
  jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode dari Repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 21 (Wajib untuk sqflite dan Gradle terbaru)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # Sesuaikan dengan versi Flutter Anda
          channel: 'stable'
          cache: true

      # 4. Ambil Dependencies (Pub Get)
      # Kita gunakan working-directory karena file pubspec.yaml ada di folder apps/client_connectivity
      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/client_connectivity

      # 5. Build APK (Android)
      - name: Build APK
        run: flutter build apk --release
        working-directory: apps/client_connectivity
        env:
          # Memberitahu Android di mana Flutter berada agar tidak muncul "Flutter SDK not found"
          FLUTTER_ROOT: ${{ env.FLUTTER_HOME }}

      # 6. Build Flutter Web
      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity

      # 7. Deploy ke Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project matrixsphere-c3de9 --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # Penting: Jalankan perintah firebase dari dalam folder yang ada file firebase.json
          PROJECT_PATH: apps/client_connectivity

      # 8. Upload Hasil APK ke GitHub Artifacts (Agar bisa Anda download)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
  