name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

jobs:
  
  # Langkah 1: Build Windows terlebih dahulu
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Windows
        run: flutter build windows --release
        working-directory: apps/client_connectivity

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-windows
          path: apps/client_connectivity/build/windows/x64/runner/Release/

  # Langkah 2: Build Linux
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          flutter build linux --release
        working-directory: apps/client_connectivity

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-client-linux
          path: apps/client_connectivity/build/linux/x64/release/bundle/

  build_and_deploy_web:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity

      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          # GANTI YOUR_PROJECT_ID dengan ID proyek Anda, misalnya: matrixsphere-organisation
          service_account: 'github-actions-deployer@matrixsphere-organisation.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        uses: firebase/firebase-tools-action@v0
        with:
          # Hapus --token dan biarkan action ini menggunakan autentikasi dari langkah sebelumnya
          args: deploy --only hosting --project matrixsphere-organisation
        working-directory: apps/client_connectivity

  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write' # Diperlukan untuk membuat rilis
      id-token: 'write'  # Diperlukan untuk autentikasi ke Google Cloud

    steps:
      - uses: actions/checkout@v4

      # Cache Setup
      - name: Cache Gradle & Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: ${{ runner.os }}-${{ hashFiles('**/pubspec.lock', '**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-
            
      # Setup Environment
      - name: Setup Java & Flutter
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.x'

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap --verbose

      # Build APK
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        working-directory: apps/client_connectivity

      # Autentikasi ke Google Cloud untuk App Distribution
      - name: Authenticate to Google Cloud
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/867626788516/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          # GANTI YOUR_PROJECT_ID dengan ID proyek Anda, misalnya: matrixsphere-organisation
          service_account: 'github-actions-deployer@matrixsphere-organisation.iam.gserviceaccount.com'

      # 1. UPLOAD KE FIREBASE APP DISTRIBUTION
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_CLIENT_APP_ID }}
          # Hapus 'token' dan biarkan action ini menggunakan autentikasi dari langkah 'auth'
          groups: testers
          file: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk

      # 2. UPLOAD KE GITHUB RELEASES (Home Repo)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/client_connectivity/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
