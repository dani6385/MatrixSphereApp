name: Build, Release Client to Repo Home & deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client_connectivity/**'
      - 'apps/client_connectivity/pubspec.yaml'
  workflow_dispatch:

# Definisi Template untuk reusable steps agar lebih bersih
jobs:
  build_all:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: windows
          - os: ubuntu-latest
            platform: linux
            build_cmd: linux
          - os: ubuntu-latest
            platform: android
            build_cmd: apk --release
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Cache Terpadu
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-build-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Fitur bawaan untuk mempercepat cache SDK

      - name: Install Dependencies
        run: flutter pub get
        working-directory: apps/client_connectivity

      - name: Build ${{ matrix.platform }}
        run: flutter build ${{ matrix.build_cmd }}
        working-directory: apps/client_connectivity

  build_web_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
      
      - run: flutter pub get
        working-directory: apps/client_connectivity
      
      - run: flutter build web --release
        working-directory: apps/client_connectivity

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project matrixsphere-c3de9
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}