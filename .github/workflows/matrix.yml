name: Build, Release MatrixSphere to Repo Home & deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Definisi Template untuk reusable steps agar lebih bersih
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: SS Shop Sphere
            path: apps/shop_sphere
            trigger: apps/shop_sphere/**
          - app: SS Seller Sphere
            path: apps/seller_sphere
            trigger: apps/seller_sphere/**
          - app: CC Client Connectivity
            path: apps/client_coonectivity
            trigger: apps/client_coonectivity/**
          - app: Admin Mikrotik
            path: apps/admin_mikrotik
            trigger: apps/admin_mikrotik/**
          - app: Matrix Sphere
            path: .
            trigger: lib/**, pubspec.yaml
    if: |
      github.event_name == 'workflow_dispatch' || 
      contains(github.event.head_commit.modified, matrix.path)
  # 1. BUILD ANDROID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'gradle' }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
      - name: Build APK
        run: flutter build apk --release
        # working-directory: apps/Matrix_Sphere

  # 2. BUILD WEB & DEPLOY
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build Web
        run: flutter build web --release
        # working-directory: apps/Matrix_Sphere
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project matrixsphere-c3de9
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          # PROJECT_PATH: apps/Matrix_Sphere

  # 3. BUILD WINDOWS (Optimasi Cache)
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: build/windows
          key: win-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Windows
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release
        # working-directory: apps/Matrix_Sphere

  # 4. BUILD LINUX (Optimasi Cache)
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: apps/Matrix_Spherebuild/linux
          key: lin-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
        # working-directory: apps/Matrix_Sphere

  # 5. BUILD APPLE (macOS)
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
        # working-directory: apps/Matrix_Sphere