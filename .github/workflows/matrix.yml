name: Build, Release Matrix Sphere to Repo Home & deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # JOB 1: Mendeteksi folder mana saja yang memiliki perubahan kode
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Mengekspor hasil deteksi agar bisa dibaca oleh job berikutnya
      shop_sphere: ${{ steps.filter.outputs.shop_sphere }}
      seller_sphere: ${{ steps.filter.outputs.seller_sphere }}
      client_connectivity: ${{ steps.filter.outputs.client_connectivity }}
      admin_mikrotik: ${{ steps.filter.outputs.admin_mikrotik }}
      matrix_sphere: ${{ steps.filter.outputs.matrix_sphere }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shop_sphere:
              - 'apps/shop_sphere/**'
              - 'pubspec.yaml'
            seller_sphere:
              - 'apps/seller_sphere/**'
              - 'pubspec.yaml'
            client_connectivity:
              - 'apps/client_connectivity/**'
              - 'pubspec.yaml'
            admin_mikrotik:
              - 'apps/admin_mikrotik/**'
              - 'pubspec.yaml'
            matrix_sphere:
              - 'apps/matrix_sphere/**'
              - 'pubspec.yaml'

  # JOB 2: Melakukan Build dan Deploy secara paralel menggunakan Matrix
  build_and_deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Jika satu aplikasi gagal build, aplikasi lain tetap lanjut
      matrix:
        include:
          - app: "SS Shop Sphere"
            dir: "apps/shop_sphere"
            firebase_project: "ss-shop-sphere" # ID Project Firebase untuk Shop
            firebase_secret_name: "FIREBASE_SERVICE_ACCOUNT_SS_SHOP_SPHERE"
            should_run: ${{ needs.detect-changes.outputs.shop_sphere }}

          - app: "SS Seller Sphere"
            dir: "apps/seller_sphere"
            firebase_project: "ss-selles-sphere" # ID Project Firebase untuk Seller
            firebase_secret_name: "FIREBASE_SERVICE_ACCOUNT_SS_SELLES_SPHERE"
            should_run: ${{ needs.detect-changes.outputs.seller_sphere }}

          - app: "CC Client Connectivity"
            dir: "apps/client_connectivity"
            firebase_project: "cc-client-connectivity"
            firebase_secret_name: "FIREBASE_SERVICE_ACCOUNT_CC_CLIENT"
            should_run: ${{ needs.detect-changes.outputs.client_connectivity }}

          - app: "Admin Mikrotik"
            dir: "apps/admin_mikrotik"
            firebase_project: "admin-mikrotik-project-id" # Sesuaikan ID Project Firebase Anda
            firebase_secret_name: "FIREBASE_SERVICE_ACCOUNT_ADMIN_MIKROTIK"
            should_run: ${{ needs.detect-changes.outputs.admin_mikrotik }}

          - app: "Matrix Sphere"
            dir: "apps/matrix_sphere"
            firebase_project: "matrix-sphere-project-id" # Sesuaikan ID Project Firebase Anda
            firebase_secret_name: "FIREBASE_SERVICE_ACCOUNT_MATRIX_SPHERE"
            should_run: ${{ needs.detect-changes.outputs.matrix_sphere }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Cache dependensi yang dipisahkan per aplikasi agar tidak bentrok
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ matrix.app }}-dependencies-${{ hashFiles(format('{0}/pubspec.lock', matrix.dir)) }}

      # Cache folder build unik untuk masing-masing aplikasi
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build
          key: build-${{ runner.os }}-${{ matrix.app }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.app }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Web
        run: flutter build web --release
        working-directory: ${{ matrix.dir }} # Berpindah ke folder aplikasi yang sesuai sebelum build

      # Mengunggah hasil build aplikasi ke Firebase Hosting masing-masing
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Mengambil kredensial secara dinamis sesuai nama secret yang didefinisikan pada matrix
          firebaseServiceAccount: ${{ secrets[matrix.firebase_secret_name] }}
          projectId: ${{ matrix.firebase_project }}
          channelId: live

  # 2. BUILD ANDROID
  build_android:
    needs: build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build Apk
        run: flutter build apk --release
        working-directory: apps/client_connectivity
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project matrixsphere-c3de9
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_PATH: .

  # 3. BUILD WINDOWS (Optimasi Cache)
  build_windows:
    needs: build_web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: build/windows
          key: win-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Windows
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release
        working-directory: .

  # 4. BUILD LINUX (Optimasi Cache)
  build_linux:
    needs: build_web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: build/linux
          key: lin-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
        working-directory: .

  # 5. BUILD APPLE (macOS)
  build_apple:
    needs: build_web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
        working-directory: .