name: Build, Release Matrix Sphere to Repo Home & deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Definisi Template untuk reusable steps agar lebih bersih
jobs:
  # 1. BUILD ANDROID
  build_android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: SS Shop Sphere
            path:
              - 'apps/client_connectivity/**'
              - 'apps/client_connectivity/pubspec.yaml'
          - app: SS Seller Sphere
            paths:
              - 'apps/seller_sphere/**'
              - 'apps/seller_sphere/pubspec.yaml'
          - app: CC Client Connectivity
            paths:
              - 'apps/seller_sphere/**'
              - 'apps/seller_sphere/pubspec.yaml'
          - app: Admin Mikrotik
            paths:
              - 'apps/shop_sphere/**'
              - 'apps/shop_sphere/pubspec.yaml'
          - app: Matrix Sphere
            paths:
              - '**'
              - 'pubspec.yaml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'gradle' }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
      - name: Build APK
        run: flutter build apk --release
        working-directory: apps/client_connectivity

  # 2. BUILD WEB & DEPLOY
  build_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build Web
        run: flutter build web --release
        working-directory: apps/client_connectivity
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting --project matrixsphere-c3de9
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_PATH: apps/client_connectivity

  # 3. BUILD WINDOWS (Optimasi Cache)
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build/windows
          key: win-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Windows
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter build windows --release
        working-directory: apps/client_connectivity

  # 4. BUILD LINUX (Optimasi Cache)
  build_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Install Deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build/linux
          key: lin-${{ hashFiles('**/pubspec.lock') }}
      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release
        working-directory: apps/client_connectivity

  # 5. BUILD APPLE (macOS)
  build_apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable', cache: true }
        # 1. Cache SDK & Dependensi (Pub & Gradle)
      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-dependencies-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}

      # 2. Cache Folder Build (INI YANG BIKIN CEPAT!)
      - name: Cache Flutter Build
        uses: actions/cache@v4
        with:
          path: apps/client_connectivity/build
          key: build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            build-${{ runner.os }}-
      - name: Build macOS
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
        working-directory: apps/client_connectivity