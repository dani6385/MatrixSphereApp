name: Build and Deploy Matrix Sphere

on:
  push:
    branches:
      - main
    paths:
      - 'apps/matrix_sphere/**'
      - 'packages/**'
      - '.github/workflows/matrix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/matrix_sphere/**'
      - 'packages/**'
      - '.github/workflows/matrix.yml'

jobs:
  build:
    name: Build Matrix Sphere App
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install Melos
        run: dart pub global activate melos

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Bootstrap dependencies
        run: melos bootstrap

      - name: 5. Build APK for Matrix Sphere
        run: |-
          cd apps/matrix_sphere
          flutter build apk --release
