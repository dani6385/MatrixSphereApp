name: Build and Deploy MatrixSphere

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: SS Shop Sphere
            path: apps/shop_sphere
          - app: SS Seller Sphere
            path: apps/seller_sphere
          - app: CC Client Connectivity
            path: apps/client_coonectivity
          - app: Admin Mikrotik
            path: apps/admin_mikrotik
          - app: Matrix Sphere
            path: .

    steps:
      # 1. Perbaikan Izin Akses (Fix error EACCES)
      - name: Fix Directory Permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }}

      # 2. Checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. Filter Perubahan Folder
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            project: '${{ matrix.path }}/**'

      # 4. Setup Flutter (Hanya jalan jika ada perubahan)
      - uses: subosito/flutter-action@v2
        if: steps.filter.outputs.project == 'true' || github.event_name == 'workflow_dispatch'
        with:
          channel: 'stable'
          cache: true

      # 5. Build Project
      - name: Build Project
        if: steps.filter.outputs.project == 'true' || github.event_name == 'workflow_dispatch'
        run: flutter build apk --release --no-pub --dart-define=flutter.android.newDs1=false
        working-directory: ${{ matrix.path }}