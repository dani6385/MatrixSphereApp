name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Build web
        run: melos run build:client_hotspot

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Langkah Perbaikan: Masuk ke folder aplikasi sebelum menjalankan perintah apapun
      - name: Build Web and APK
        run: |
          cd apps/client_hotspot
          flutter pub get
          flutter build web --release
          flutter build apk --release

      # Deploy ke Firebase (Harus diarahkan ke folder hasil build)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATRIXSPHERE_APP }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          entryPoint: 'apps/client_hotspot' # Penting untuk monorepo
          buildContext: 'apps/client_hotspot'

      # Upload APK sebagai artifact
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apps/client_hotspot/build/app/outputs/flutter-apk/app-release.apk