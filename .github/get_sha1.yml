name: Get Android SHA1

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/seller_sphere

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Gradle Wrapper & Build Debug
        run: flutter build apk --debug

      - name: Run Signing Report
        run: |
          cd android
          ./gradlew signingReport