workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release --build-name=1.0.0 --build-number=1
    artifacts:
      # Menyesuaikan dengan custom build directory di build.gradle.kts Anda
      - ../build/app/outputs/flutter-apk/app-release.apk
    publishing:
      firebase:
        # Codemagic uses a different schema for publishing. 
        # For Firebase App Distribution, use the built-in integration:
        android:
          app_id: $FIREBASE_APP_ID_ANDROID
          groups:
            - sphere
      email:
        recipients:
          - your-email@example.com